name: Actualizar Precios de Acciones

on:
  # Inicia a las 16:10 NY (10 min antes del cierre oficial)
  # Reintenta internamente cada 5 min hasta obtener los datos del día
  schedule:
    - cron: '10 20 * * 1-5'  # 16:10 NY verano (EDT, UTC-4)
    - cron: '10 21 * * 1-5'  # 16:10 NY invierno (EST, UTC-5)

  # Ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  actualizar-precios:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Descargar precios con reintentos
        run: |
          HOY=$(TZ='America/New_York' date '+%Y-%m-%d')
          echo "Fecha objetivo (NY): $HOY"

          MAX_INTENTOS=10
          ESPERA=300  # 5 minutos entre intentos

          for i in $(seq 1 $MAX_INTENTOS); do
            echo ""
            echo "=== Intento $i/$MAX_INTENTOS — $(date -u '+%H:%M UTC') ==="
            python descargar_precios_cloud.py

            if grep -q "^$HOY," data/auto_update_log.csv; then
              echo "✅ Datos de $HOY descargados correctamente"
              break
            fi

            if [ $i -lt $MAX_INTENTOS ]; then
              echo "⏳ Datos de $HOY aún no disponibles. Reintentando en ${ESPERA}s..."
              sleep $ESPERA
            else
              echo "❌ No se obtuvieron datos de $HOY tras $MAX_INTENTOS intentos"
              exit 1
            fi
          done

      - name: Verificar cambios y hacer push
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git add data/auto_update_log.csv
            git commit -m "Actualización automática de precios - $(TZ='America/New_York' date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ Push completado"
          else
            echo "Sin cambios nuevos para subir"
          fi
