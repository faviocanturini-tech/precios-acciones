name: Actualizar Precios de Acciones

on:
  # Inicia a las 16:10 NY (10 min antes del cierre oficial)
  # Reintenta internamente cada 5 min hasta obtener los datos del día
  schedule:
    - cron: '10 20 * * 1-5'  # 16:10 NY verano (EDT, UTC-4)
    - cron: '10 21 * * 1-5'  # 16:10 NY invierno (EST, UTC-5)

  # Ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  actualizar-precios:
    runs-on: ubuntu-latest
    timeout-minutes: 220   # margen para reintentar tras el cierre hasta ~19:30 NY

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Descargar precios hasta obtener el cierre del dia
        run: |
          HOY=$(TZ='America/New_York' date '+%Y-%m-%d')
          echo "Fecha objetivo (NY): $HOY"

          ESPERA=300          # 5 minutos entre intentos
          LIMITE_NY="19:30"   # reintentar hasta las 19:30 NY (muy por detras del cierre 16:00)
          intento=0

          while true; do
            intento=$((intento + 1))
            AHORA_NY=$(TZ='America/New_York' date '+%H:%M')
            echo ""
            echo "=== Intento $intento — $AHORA_NY NY / $(date -u '+%H:%M UTC') ==="

            # '|| true' para que un fallo transitorio de yfinance no corte el bucle
            python descargar_precios_cloud.py || true

            # Exito solo si llego el cierre de HOY de un ticker US de referencia (AAPL).
            # Usar AAPL evita falsos positivos en feriados NYSE donde solo cotiza IGLN.L (Londres).
            if grep -q "^$HOY,AAPL," data/auto_update_log.csv; then
              echo "✅ Cierre de $HOY disponible (AAPL presente)"
              break
            fi

            if [[ "$AHORA_NY" > "$LIMITE_NY" ]]; then
              echo "❌ No se obtuvo el cierre de $HOY antes de las $LIMITE_NY NY (¿feriado o falla de yfinance?)"
              exit 1
            fi

            echo "⏳ Cierre de $HOY aún no disponible. Reintentando en ${ESPERA}s..."
            sleep $ESPERA
          done

      - name: Verificar cambios y hacer push
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git add data/auto_update_log.csv
            git commit -m "Actualización automática de precios - $(TZ='America/New_York' date '+%Y-%m-%d %H:%M')"
            # Push resiliente: si main avanzo por un push concurrente (otro workflow,
            # o un push manual), rebasar y reintentar en vez de fallar.
            PUSHEADO=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                echo "✅ Push completado (intento $i)"
                PUSHEADO=1
                break
              fi
              echo "⏳ Push rechazado (commits concurrentes). Reintento $i/5..."
              sleep 5
            done
            if [ "$PUSHEADO" -ne 1 ]; then
              echo "❌ No se pudo pushear tras 5 intentos"
              exit 1
            fi
          else
            echo "Sin cambios nuevos para subir"
          fi
