name: Preparar Datos Slot 6

on:
  # Ejecutar automáticamente 30 minutos antes de apertura NY
  # 9:00 AM NY = 14:00 UTC (invierno) / 13:00 UTC (verano)
  schedule:
    - cron: '0 14 * * 1-5'  # Lunes a Viernes a las 14:00 UTC (9:00 AM NY invierno)

  # También permitir ejecución manual
  workflow_dispatch:

jobs:
  preparar-datos-slot6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install yfinance pandas numpy scipy pandas_market_calendars pytz

      - name: Verificar si es día de trading
        id: check_trading_day
        run: |
          python << 'EOF'
          import pandas_market_calendars as mcal
          from datetime import datetime
          import pytz
          import os

          # Obtener fecha en NY
          ny_tz = pytz.timezone('America/New_York')
          fecha_ny = datetime.now(ny_tz).strftime('%Y-%m-%d')

          # Verificar si NYSE está abierto hoy
          nyse = mcal.get_calendar('NYSE')
          schedule = nyse.schedule(start_date=fecha_ny, end_date=fecha_ny)

          # Escribir resultado a GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              if schedule.empty:
                  print(f"⚠️ {fecha_ny} NO es día de trading (feriado o fin de semana)")
                  f.write("is_trading_day=false\n")
              else:
                  print(f"✅ {fecha_ny} ES día de trading")
                  f.write("is_trading_day=true\n")
          EOF

      - name: Salir si no es día de trading
        if: steps.check_trading_day.outputs.is_trading_day == 'false'
        run: |
          echo "=========================================="
          echo "SALTANDO WORKFLOW - NO ES DÍA DE TRADING"
          echo "=========================================="
          echo "El mercado está cerrado hoy (feriado o fin de semana)"

      - name: Configurar Git
        if: steps.check_trading_day.outputs.is_trading_day == 'true'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Sincronizar precios (fetch más recientes)
        if: steps.check_trading_day.outputs.is_trading_day == 'true'
        env:
          REPO_PATH: ${{ github.workspace }}
        run: |
          echo "=== Actualizando precios desde yfinance ==="
          python descargar_precios_cloud.py

      - name: Preparar datos para análisis Claude
        if: steps.check_trading_day.outputs.is_trading_day == 'true'
        env:
          REPO_PATH: ${{ github.workspace }}
        run: |
          echo "=== Preparando datos para análisis Claude ==="
          echo "Hora UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Hora NY: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          python preparar_datos_analisis.py

      - name: Crear archivo trigger para Claude
        if: steps.check_trading_day.outputs.is_trading_day == 'true'
        run: |
          FECHA_NY=$(TZ='America/New_York' date '+%Y-%m-%d')
          HORA_NY=$(TZ='America/New_York' date '+%H:%M:%S')

          # Crear archivo trigger con la información necesaria
          cat > data/trigger_analisis_claude.json << EOF
          {
            "fecha": "$FECHA_NY",
            "hora_generacion": "$HORA_NY",
            "estado": "pendiente",
            "plataforma": "IBKR-UK",
            "modo": "Real",
            "mensaje": "Datos listos para análisis de Claude - Slot 6"
          }
          EOF

          echo "Archivo trigger creado: data/trigger_analisis_claude.json"

      - name: Verificar cambios y hacer push del trigger
        if: steps.check_trading_day.outputs.is_trading_day == 'true'
        run: |
          git status
          if [[ -n $(git status --porcelain) ]]; then
            git add data/auto_update_log.csv
            git add data/datos_para_analisis.json
            git add data/trigger_analisis_claude.json

            git commit -m "Datos Slot 6 listos - $(TZ='America/New_York' date '+%Y-%m-%d %H:%M')"
            git push

            echo ""
            echo "=== TRIGGER ENVIADO - ESPERANDO CONFIRMACION DE CLAUDE ==="
          else
            echo "No hay cambios nuevos para subir"
          fi

      - name: Polling hasta confirmacion de Claude (timeout 9:30 AM NY)
        if: steps.check_trading_day.outputs.is_trading_day == 'true'
        run: |
          echo "Iniciando polling cada 20 segundos..."
          echo "Timeout: 9:30 AM NY (60 intentos maximo)"
          echo ""

          for i in {1..60}; do
            HORA_NY=$(TZ='America/New_York' date '+%H:%M:%S')
            echo "[$HORA_NY] Intento $i/60 - Buscando confirmacion..."

            # Fetch cambios del repo
            git fetch origin main --quiet

            # Verificar si Claude confirmo
            CONFIRMADO=$(git show origin/main:data/trigger_analisis_claude.json 2>/dev/null | grep -o '"estado"[[:space:]]*:[[:space:]]*"confirmado"' || echo "")

            if [[ -n "$CONFIRMADO" ]]; then
              echo ""
              echo "=========================================="
              echo "CONFIRMACION RECIBIDA DE CLAUDE"
              echo "=========================================="
              echo "Claude ha iniciado el analisis del Slot 6"
              exit 0
            fi

            # Verificar si ya son las 9:30 AM NY
            HORA_ACTUAL=$(TZ='America/New_York' date '+%H%M')
            if [[ "$HORA_ACTUAL" -ge "0930" ]]; then
              echo ""
              echo "=========================================="
              echo "TIMEOUT: MERCADO ABIERTO (9:30 AM NY)"
              echo "=========================================="
              echo "Claude no confirmo. El usuario dara la orden manualmente."
              exit 0
            fi

            sleep 20
          done

          echo ""
          echo "=========================================="
          echo "TIMEOUT: 60 INTENTOS COMPLETADOS"
          echo "=========================================="
          echo "Claude no confirmo. El usuario dara la orden manualmente."
